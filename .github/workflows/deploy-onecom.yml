name: Deploy to one.com

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: onecom-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Upload static website
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Stamp deployment date in HTML footers
        run: |
          DEPLOY_DATE=$(TZ=Europe/Berlin date +'%d.%m.%Y')
          for file in ./*.html; do
            sed -i "s/__DEPLOY_DATE__/$DEPLOY_DATE/g" "$file"
          done

      - name: Deploy via SFTP
        uses: wlixcc/SFTP-Deploy-Action@v1.2.6
        with:
          server: ${{ secrets.ONECOM_SFTP_HOST }}
          username: ${{ secrets.ONECOM_SFTP_USERNAME }}
          password: ${{ secrets.ONECOM_SFTP_PASSWORD }}
          port: ${{ secrets.ONECOM_SFTP_PORT }}
          sftp_only: true
          local_path: './*'
          remote_path: '.'
          sftpArgs: '-o ConnectTimeout=10'
